
<!DOCTYPE html>
<html>
<head>
    <title>Dynamic To Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #e6e6fa;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        h2 {
            color: purple;
        }

        input {
            padding: 10px;
            width: 65%;
            border: 1px solid purple;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background: purple;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            background: #f3e5f5;
            padding: 12px;
            margin: 10px;
            list-style: none;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>My To-Do List</h2>

        <input type="text" id="taskInput"
        placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <h3>My Tasks</h3>

        <ul id="taskList"></ul>

        <p id="count">Total Tasks: 0</p>

        <button onclick="clearTasks()">Clear All</button>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");

            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            let span = document.createElement("span");
            span.innerText = task;

            span.onclick = function() {
                span.classList.toggle("completed");
            };

            let btn = document.createElement("button");
            btn.innerText = "Delete";
            btn.className = "delete";

            btn.onclick = function() {
                li.remove();
                updateCount();
            };

            li.appendChild(span);
            li.appendChild(btn);

            document.getElementById("taskList")
            .appendChild(li);

            input.value = "";

            updateCount();
        }

        function updateCount() {
            let total = document.querySelectorAll("#taskList li").length;
            document.getElementById("count").innerText =
            "Total Tasks: " + total;
        }

        function clearTasks() {
            document.getElementById("taskList").innerHTML = "";
            updateCount();
        }

    </script>

</body>
</html>
